#cloud-config
# Rocky Linux 9 — Postfix + Dovecot bootstrap
# Runs once on first boot via cloud-init

package_update: true
package_upgrade: true

packages:
  - epel-release

write_files:
  - path: /etc/dovecot/conf.d/10-mail.conf
    content: |
      mail_location = maildir:~/Maildir
      namespace inbox {
        inbox = yes
      }

  # M7-T5: quarantine-verdict mail -> Quarantine mailbox, not INBOX.
  - path: /etc/dovecot/conf.d/91-esp-sieve.conf
    content: |
      plugin {
        sieve = ~/.dovecot.sieve
        sieve_before = /etc/dovecot/sieve/quarantine.sieve
      }
      protocol lmtp {
        mail_plugins = $mail_plugins sieve
      }

  - path: /etc/dovecot/sieve/quarantine.sieve
    content: |
      require ["fileinto", "mailbox"];
      if header :contains "X-Phishing-Verdict" "quarantine" {
        fileinto :create "Quarantine";
        stop;
      }

  # M7-T6: Dovecot SASL socket for Postfix's submission service (587).
  - path: /etc/dovecot/conf.d/92-esp-postfix-auth.conf
    content: |
      service auth {
        unix_listener /var/spool/postfix/private/auth {
          mode = 0666
          user = postfix
          group = postfix
        }
      }

  # LMTP, not Postfix's `local`: `local` writes mbox to /var/spool/mail/$user,
  # which Dovecot (maildir:~/Maildir) cannot see, so IMAP shows an empty inbox.
  # Sieve also only runs under LMTP. auth_username_format strips the domain —
  # PAM users are "klara", LMTP hands over "klara@mail.naratech.xyz".
  - path: /etc/dovecot/conf.d/93-esp-lmtp.conf
    content: |
      protocols = imap lmtp sieve
      auth_username_format = %Ln
      service lmtp {
        unix_listener /var/spool/postfix/private/dovecot-lmtp {
          mode = 0600
          user = postfix
          group = postfix
        }
      }

  # The dovecot RPM ships a placeholder cert (CN=imap.example.com); clients
  # then fail the handshake on a hostname mismatch, surfacing only as an opaque
  # "cannot connect". Use the same cert Postfix does (real SAN, see runcmd).
  - path: /etc/dovecot/conf.d/94-esp-ssl.conf
    content: |
      ssl = required
      ssl_cert = </etc/pki/postfix/postfix.crt
      ssl_key = </etc/pki/postfix/postfix.key
      ssl_min_protocol = TLSv1.2

  # M7-T4 content_filter: scores each message via the API, tags
  # X-Phishing-Verdict/X-Phishing-Score, re-injects. Fails open on error.
  - path: /usr/local/bin/phishing_filter.py
    permissions: '0755'
    content: |
      #!/usr/bin/env python3
      import json
      import subprocess
      import sys
      import urllib.error
      import urllib.request

      API_URL = "http://${api_internal_url}/analyze/email"
      TOKEN_FILE = "/etc/esp/api-token"
      TIMEOUT = 45  # first call after an ECS task start loads models from S3 (~20-40s); warm calls are ~0.3s
      SENDMAIL = "/usr/sbin/sendmail"


      def read_token():
          try:
              with open(TOKEN_FILE) as f:
                  return f.read().strip()
          except Exception:
              return None


      def score(raw_message: bytes):
          token = read_token()
          boundary = "----espfilterboundary"
          # source=server tags mail-path detections (vs dashboard upload/paste)
          body = (
              ("--" + boundary + "\r\n"
               'Content-Disposition: form-data; name="source"\r\n\r\n'
               "server\r\n"
               "--" + boundary + "\r\n"
               'Content-Disposition: form-data; name="file"; filename="msg.eml"\r\n'
               "Content-Type: message/rfc822\r\n\r\n").encode()
              + raw_message
              + ("\r\n--" + boundary + "--\r\n").encode()
          )
          headers = {"Content-Type": "multipart/form-data; boundary=" + boundary}
          if token:
              headers["Authorization"] = "Bearer " + token

          req = urllib.request.Request(API_URL, data=body, headers=headers, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=TIMEOUT) as resp:
                  return json.loads(resp.read())
          except Exception as e:
              sys.stderr.write("phishing_filter: API call failed, failing open: " + str(e) + "\n")
              return None


      def tag_headers(raw_message: bytes, verdict_json) -> bytes:
          if verdict_json is None:
              return raw_message  # fail open — deliver unmodified
          verdict = verdict_json.get("verdict", "clean")
          likelihood = verdict_json.get("likelihood", 0)
          header = ("X-Phishing-Verdict: " + str(verdict) + "\r\n"
                     "X-Phishing-Score: " + str(likelihood) + "\r\n").encode()
          return header + raw_message


      def deliver(message: bytes, sender: str, recipients: list) -> int:
          # -G skips content_filter again (no re-scoring loop); -i keeps a
          # lone "." line from being treated as end-of-message.
          proc = subprocess.run(
              [SENDMAIL, "-G", "-i", "-f", sender, "--"] + recipients,
              input=message,
          )
          return proc.returncode


      def main():
          args = sys.argv[1:]
          if "-f" not in args or "--" not in args:
              sys.stderr.write("usage: phishing_filter.py -f <sender> -- <recipient...>\n")
              sys.exit(1)
          sender = args[args.index("-f") + 1]
          recipients = args[args.index("--") + 1:]
          raw = sys.stdin.buffer.read()

          try:
              verdict_json = score(raw)
              out = tag_headers(raw, verdict_json)
          except Exception as e:
              sys.stderr.write("phishing_filter: unexpected error, failing open: " + str(e) + "\n")
              out = raw  # never lose or block mail

          sys.exit(deliver(out, sender, recipients))


      if __name__ == "__main__":
          main()

runcmd:
  # Rocky's AMI ships neither SSM Agent nor EC2 Instance Connect; install first.
  - dnf install -y https://s3.us-east-1.amazonaws.com/amazon-ssm-us-east-1/latest/linux_amd64/amazon-ssm-agent.rpm || true
  - systemctl enable --now amazon-ssm-agent || true
  - dnf install -y ec2-instance-connect || true

  # dovecot-pigeonhole = Sieve (M7-T5); unzip = for the AWS CLI installer;
  # cyrus-sasl-plain = SASL PLAIN for the *client* side, required to authenticate
  # to the SES relay — without it Postfix reports "no mechanism available".
  - dnf install -y postfix dovecot dovecot-pigeonhole swaks s-nail unzip cyrus-sasl-plain

  - postconf -e "myhostname = ${mail_hostname}"
  - postconf -e "mydomain = ${mail_domain}"
  - postconf -e "myorigin = ${mail_domain}"
  - postconf -e "inet_interfaces = all"
  - postconf -e "mydestination = ${mail_hostname}, localhost.${mail_domain}, localhost, ${mail_domain}"
  - postconf -e "mynetworks = 127.0.0.0/8"
  - postconf -e "smtpd_recipient_restrictions = permit_mynetworks, reject_unauth_destination"
  # Rocky 9's main.cf has no `include` for main.cf.d, so every setting must go
  # through postconf here — a drop-in file there is silently ignored.
  - postconf -e "mailbox_transport = lmtp:unix:private/dovecot-lmtp"
  - newaliases

  # Self-signed cert shared by Postfix submission (587) and Dovecot (993/143).
  # subjectAltName is mandatory: clients ignore CN and reject a cert with no SAN.
  - mkdir -p /etc/pki/postfix
  - openssl req -x509 -nodes -newkey rsa:2048 -days 825 -keyout /etc/pki/postfix/postfix.key -out /etc/pki/postfix/postfix.crt -subj "/CN=${mail_hostname}" -addext "subjectAltName=DNS:${mail_hostname},DNS:${mail_domain}"
  # Dovecot runs as its own user and must be able to read the shared key.
  - chgrp dovecot /etc/pki/postfix/postfix.key
  - chmod 640 /etc/pki/postfix/postfix.key
  - postconf -e "smtpd_tls_cert_file = /etc/pki/postfix/postfix.crt"
  - postconf -e "smtpd_tls_key_file = /etc/pki/postfix/postfix.key"
  - postconf -e "smtpd_tls_security_level = may"

  # M7-T6: authenticated SMTP submission (587) — clients send through us,
  # port 25 stays receive-only. All SASL/relay logic scoped via -o here.
  - |
    cat >> /etc/postfix/master.cf << 'MASTERCF'

    submission inet n - n - - smtpd
      -o syslog_name=postfix/submission
      -o smtpd_tls_security_level=encrypt
      -o smtpd_sasl_auth_enable=yes
      -o smtpd_sasl_type=dovecot
      -o smtpd_sasl_path=private/auth
      -o smtpd_client_restrictions=permit_sasl_authenticated,reject
      -o smtpd_relay_restrictions=permit_sasl_authenticated,reject
      -o smtpd_recipient_restrictions=permit_sasl_authenticated,reject
      -o milter_macro_daemon_name=ORIGINATING
    MASTERCF

  - useradd -m testuser1 || true
  - useradd -m testuser2 || true
  - echo "testuser1:ChangeMe123!" | chpasswd
  - echo "testuser2:ChangeMe123!" | chpasswd

  # M7-T6 named accounts for external client testing.
  - useradd -m klara || true
  - useradd -m john || true
  - useradd -m michael || true
  - echo "klara:Klara2026!" | chpasswd
  - echo "john:John2026!" | chpasswd
  - echo "michael:Michael2026!" | chpasswd

  # Official installer — AWS CLI isn't reliably packaged for RHEL9 via EPEL.
  - curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
  - unzip -q /tmp/awscliv2.zip -d /tmp
  - /tmp/aws/install
  - rm -rf /tmp/awscliv2.zip /tmp/aws

  - useradd -r -s /sbin/nologin filter || true

  # Fetch the JWT key once at boot; content_filter reads it from disk.
  - mkdir -p /etc/esp
  - >-
    aws secretsmanager get-secret-value
    --secret-id ${jwt_signing_key_secret_arn}
    --region us-east-1
    --query SecretString --output text > /etc/esp/api-token
  - chmod 600 /etc/esp/api-token
  - chown filter:filter /etc/esp/api-token

  # M7-T6: AWS blocks outbound :25 from EC2, so external mail relays via SES
  # on :587, which also DKIM-signs it. See modules/ses_relay.
  - >-
    aws secretsmanager get-secret-value
    --secret-id ${ses_smtp_secret_arn}
    --region us-east-1
    --query SecretString --output text > /tmp/ses.json
  - python3 -c "import json;d=json.load(open('/tmp/ses.json'));print('${ses_relay_host} %s:%s'%(d['username'],d['password']))" > /etc/postfix/sasl_passwd
  - rm -f /tmp/ses.json
  - postmap /etc/postfix/sasl_passwd
  - chmod 600 /etc/postfix/sasl_passwd /etc/postfix/sasl_passwd.db
  - postconf -e "relayhost = ${ses_relay_host}"
  - postconf -e "smtp_sasl_auth_enable = yes"
  - postconf -e "smtp_sasl_password_maps = hash:/etc/postfix/sasl_passwd"
  - postconf -e "smtp_sasl_security_options = noanonymous"
  - postconf -e "smtp_tls_security_level = encrypt"

  # Scoped to the port-25 smtp service, never global: the filter's own sendmail
  # re-injection arrives via `pickup`, so a global setting refilters it forever
  # (pipe -> reinject -> pickup -> pipe -> ...) and mail never reaches Dovecot.
  # $${sender}/$${recipient} are Postfix placeholders, escaped from templatefile().
  - postconf -P 'smtp/inet/content_filter=phishing-filter:dummy'
  - |
    cat >> /etc/postfix/master.cf << 'MASTERCF'

    phishing-filter unix - n n - 10 pipe
      flags=Rq user=filter null_sender=
      argv=/usr/local/bin/phishing_filter.py -f $${sender} -- $${recipient}
    MASTERCF

  - sievec /etc/dovecot/sieve/quarantine.sieve

  - systemctl enable --now postfix dovecot
  - systemctl restart postfix dovecot

  - swaks --to testuser2@localhost --from testuser1@localhost --server 127.0.0.1 --helo ${mail_hostname} || true

final_message: |
  Rocky Linux 9 mail server bootstrap complete.
  Postfix and Dovecot are running, content_filter active (M7-T4/T5).
  Local test accounts: testuser1, testuser2 (password: ChangeMe123!)
  Named accounts: klara@mail.naratech.xyz, john@mail.naratech.xyz, michael@mail.naratech.xyz
    (passwords: Klara2026! / John2026! / Michael2026! — change on first login)
  IMAP: port 143 (STARTTLS). SMTP submission: port 587 (STARTTLS, SASL).
  Run: swaks --to testuser2@localhost --from testuser1@localhost
