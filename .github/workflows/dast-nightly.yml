name: DAST — Nightly Active Scan

# docs/devsecops.md §3.3 — the gate that actually blocks promotion. Runs
# active/attack-style ZAP scanning + Schemathesis property-based fuzzing
# against the live dev API. Nightly, not on every PR: DAST needs a running
# target (can't run on a bare PR) and active scanning is comparatively slow
# and resource-heavy.
#
# Known, accepted trade-off: this generates real POST traffic against the
# SHARED dev/prod backend (see the PR that added §3.3's "shared backend"
# decision) -- Schemathesis in particular will fuzz /analyze/email with
# generated bodies, creating detections rows with garbage subjects/senders.
# submitted_by is a client-supplied form field (backend/main.py), not derived
# from the auth token, so generated rows are NOT reliably attributable to a
# "dast-bot" identity by query. Scheduled at low-traffic hours and bounded
# by --max-examples for this reason. Before a demo: manually review/clear
# recent low-likelihood detections with an obviously fuzzed subject/sender.
# NOTE: `schedule` only fires from the repository's DEFAULT branch, which is
# `naratech` here (not `dev`). So the nightly does not start running on a
# cadence until this file reaches naratech; before then, trigger it manually
# with `gh workflow run dast-nightly.yml`. Its runs are attributed to
# naratech, which is why naratech-promotion-gate.yml deliberately does not
# filter by branch when reading the latest conclusion.
on:
  schedule:
    - cron: "0 8 * * *" # 03:00 America/Toronto (04:00 EDT) -- low traffic, well clear of demo hours
  workflow_dispatch: {}

env:
  TARGET: "https://esp-api.naratech.xyz"

jobs:
  zap-active:
    name: ZAP full active scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6

      # Unauthenticated for now: ZAP's authenticated-request replacer config
      # needs an actual Docker run to validate the header injection, which
      # this PR doesn't include untested. Still real coverage -- headers,
      # error handling, and auth-bypass attempts against every discovered
      # endpoint. Tracked separately to add authenticated coverage once
      # verified against a real run.
      - name: ZAP full active scan
        # v0.13.0 is action-full-scan's latest -- it does NOT share a version
        # number with action-baseline (which is at v0.15.0). Both are node24.
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ env.TARGET }}
          cmd_options: "-a"
          # fail_action: false, deliberately. The input has no severity
          # threshold -- it fails on ANY alert including WARNs. The first real
          # run was FAIL-NEW: 0 / PASS: 145 with two WARNs (missing HSTS
          # header, proxy disclosure) and still failed the job. Gating
          # promotion on warnings means the gate fails for things nobody will
          # action, and a gate that always fails gets bypassed. The step below
          # parses the report and fails only on actual FAIL-NEW alerts.
          fail_action: false

      # ZAP writes report_json.json (-J) to the workspace. Gate on it directly:
      # riskcode 3 = High, 2 = Medium, 1 = Low, 0 = Informational.
      #
      # Threshold is High-only, matching devsecops.md §3.3 ("a HIGH finding ...
      # blocks promotion"). Verified against a real report from run
      # 30234783520: that scan was FAIL-NEW 0 / PASS 145 with one Medium
      # (Proxy Disclosure) and six Low/Informational — all worth seeing, none
      # worth blocking a release on. Mediums are printed as a ::warning:: so
      # they surface in the run summary instead of being silently swallowed.
      - name: Gate on ZAP risk level
        run: |
          if [ ! -f report_json.json ]; then
            echo "::error::ZAP produced no report_json.json — failing, since an unknown scan result is not the same as a clean one."
            exit 1
          fi
          HIGH=$(jq '[.site[]?.alerts[]? | select((.riskcode|tonumber) == 3)] | length' report_json.json)
          MED=$(jq  '[.site[]?.alerts[]? | select((.riskcode|tonumber) == 2)] | length' report_json.json)
          LOW=$(jq  '[.site[]?.alerts[]? | select((.riskcode|tonumber) <  2)] | length' report_json.json)
          echo "ZAP alerts — High: $HIGH, Medium: $MED, Low/Info: $LOW"
          jq -r '.site[]?.alerts[]? | "  [risk \(.riskcode)] \(.name) (\(.instances|length) instance(s))"' report_json.json || true
          if [ "$MED" -gt 0 ]; then
            echo "::warning::$MED Medium-risk ZAP alert(s) — not blocking (§3.3 gates on High), but worth triaging."
          fi
          if [ "$HIGH" -gt 0 ]; then
            echo "::error::$HIGH High-risk ZAP alert(s) — do not promote until triaged."
            exit 1
          fi
          echo "OK — no High-risk alerts."

  schemathesis-fuzz:
    name: Schemathesis API fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Install Schemathesis
        run: pip install schemathesis

# Checks are chosen deliberately, NOT `all`. The first real run showed `all`
      # blocks on two non-security classes:
      #   - status_code_conformance: endpoints return 401 (require_auth is a
      #     FastAPI dependency) but the generated schema doesn't declare a 401
      #     response -- OpenAPI drift, not a vulnerability.
      #   - unsupported_method: TRACE returns 405 without an `Allow` header
      #     (RFC 9110). That's the uvicorn/ALB default, not app code.
      # Gating promotion on those means the gate fails for reasons nobody will
      # act on, and a gate that always fails gets ignored. These are the
      # security-relevant properties:
      #   not_a_server_error      -- fuzzed input must never 5xx
      #   response_schema_conformance -- responses must match the contract
      #   negative_data_rejection -- invalid input must be rejected, not accepted
      #   ignored_auth            -- auth must actually be enforced (auth bypass)
      #   use_after_free / ensure_resource_availability -- resource-lifecycle bugs
      # The excluded conformance checks still run in the report artifact below
      # for visibility; they just don't block promotion.
      - name: Fuzz — unauthenticated
        run: |
          schemathesis run "${{ env.TARGET }}/openapi.json" \
            --url "${{ env.TARGET }}" \
            --checks not_a_server_error,response_schema_conformance,negative_data_rejection,ignored_auth,use_after_free,ensure_resource_availability \
            --max-examples 20 \
            --report-junit-path unauth-report.xml

      # The `secrets` context is NOT available in an `if:` condition (only in
      # `with:`, `env:`, and a few other places) -- referencing it there is a
      # workflow-validation error that fails the ENTIRE file to parse, so no
      # jobs run at all. Map it to env first, then branch on the env var.
      - name: Fuzz — authenticated
        env:
          DAST_API_TOKEN: ${{ secrets.DAST_API_TOKEN }}
        run: |
          if [ -z "$DAST_API_TOKEN" ]; then
            echo "DAST_API_TOKEN not set — skipping the authenticated pass."
            echo "Set it as a repo secret to fuzz behind auth (see docs/devsecops.md §3.3)."
            exit 0
          fi
          schemathesis run "${{ env.TARGET }}/openapi.json" \
            --url "${{ env.TARGET }}" \
            --header "Authorization:Bearer $DAST_API_TOKEN" \
            --checks not_a_server_error,response_schema_conformance,negative_data_rejection,ignored_auth,use_after_free,ensure_resource_availability \
            --max-examples 20 \
            --report-junit-path auth-report.xml

      - name: Upload fuzz reports
        if: always()
        uses: actions/upload-artifact@v7 # v4 is still node20 (deprecated); v7 is node24
        with:
          name: schemathesis-reports
          path: "*-report.xml"
          retention-days: 14

  # Both scans feed into this: a naratech-targeting PR (see the
  # naratech-promotion-gate job in terraform-pr.yml or wherever the gate
  # lives) checks the CONCLUSION of the most recent run of this workflow,
  # not just whether it exists -- this job's own success/failure is that
  # signal.
  gate:
    name: DAST nightly gate
    runs-on: ubuntu-latest
    needs: [zap-active, schemathesis-fuzz]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.zap-active.result }}" == "failure" ] || [ "${{ needs.schemathesis-fuzz.result }}" == "failure" ]; then
            echo "HIGH finding(s) in tonight's DAST run -- do not promote to naratech until triaged." >&2
            exit 1
          fi
          echo "OK — no blocking findings in tonight's active scan + fuzz."
