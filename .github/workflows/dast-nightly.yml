name: DAST — Nightly Active Scan

# docs/devsecops.md §3.3 — the gate that actually blocks promotion. Runs
# active/attack-style ZAP scanning + Schemathesis property-based fuzzing
# against the live dev API. Nightly, not on every PR: DAST needs a running
# target (can't run on a bare PR) and active scanning is comparatively slow
# and resource-heavy.
#
# Known, accepted trade-off: this generates real POST traffic against the
# SHARED dev/prod backend (see the PR that added §3.3's "shared backend"
# decision) -- Schemathesis in particular will fuzz /analyze/email with
# generated bodies, creating detections rows with garbage subjects/senders.
# submitted_by is a client-supplied form field (backend/main.py), not derived
# from the auth token, so generated rows are NOT reliably attributable to a
# "dast-bot" identity by query. Scheduled at low-traffic hours and bounded
# by --max-examples for this reason. Before a demo: manually review/clear
# recent low-likelihood detections with an obviously fuzzed subject/sender.
# NOTE: `schedule` only fires from the repository's DEFAULT branch, which is
# `naratech` here (not `dev`). So the nightly does not start running on a
# cadence until this file reaches naratech; before then, trigger it manually
# with `gh workflow run dast-nightly.yml`. Its runs are attributed to
# naratech, which is why naratech-promotion-gate.yml deliberately does not
# filter by branch when reading the latest conclusion.
on:
  schedule:
    - cron: "0 8 * * *" # 03:00 America/Toronto (04:00 EDT) -- low traffic, well clear of demo hours
  workflow_dispatch: {}

env:
  TARGET: "https://esp-api.naratech.xyz"

jobs:
  zap-active:
    name: ZAP full active scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Unauthenticated for now: ZAP's authenticated-request replacer config
      # needs an actual Docker run to validate the header injection, which
      # this PR doesn't include untested. Still real coverage -- headers,
      # error handling, and auth-bypass attempts against every discovered
      # endpoint. Tracked separately to add authenticated coverage once
      # verified against a real run.
      - name: ZAP full active scan
        # v0.13.0 is action-full-scan's latest -- it does NOT share a version
        # number with action-baseline (which is at v0.15.0). Both are node24.
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ env.TARGET }}
          cmd_options: "-a"
          # fail_action: false, deliberately. The input has no severity
          # threshold -- it fails on ANY alert including WARNs. The first real
          # run was FAIL-NEW: 0 / PASS: 145 with two WARNs (missing HSTS
          # header, proxy disclosure) and still failed the job. Gating
          # promotion on warnings means the gate fails for things nobody will
          # action, and a gate that always fails gets bypassed. The step below
          # parses the report and fails only on actual FAIL-NEW alerts.
          fail_action: false

      # ZAP writes report_json.json (-J) to the workspace. Gate on it directly:
      # riskcode 3 = High, 2 = Medium, 1 = Low, 0 = Informational.
      #
      # Threshold is High-only, matching devsecops.md §3.3 ("a HIGH finding ...
      # blocks promotion"). Verified against a real report from run
      # 30234783520: that scan was FAIL-NEW 0 / PASS 145 with one Medium
      # (Proxy Disclosure) and six Low/Informational — all worth seeing, none
      # worth blocking a release on. Mediums are printed as a ::warning:: so
      # they surface in the run summary instead of being silently swallowed.
      - name: Gate on ZAP risk level
        run: |
          if [ ! -f report_json.json ]; then
            echo "::error::ZAP produced no report_json.json — failing, since an unknown scan result is not the same as a clean one."
            exit 1
          fi
          HIGH=$(jq '[.site[]?.alerts[]? | select((.riskcode|tonumber) == 3)] | length' report_json.json)
          MED=$(jq  '[.site[]?.alerts[]? | select((.riskcode|tonumber) == 2)] | length' report_json.json)
          LOW=$(jq  '[.site[]?.alerts[]? | select((.riskcode|tonumber) <  2)] | length' report_json.json)
          echo "ZAP alerts — High: $HIGH, Medium: $MED, Low/Info: $LOW"
          jq -r '.site[]?.alerts[]? | "  [risk \(.riskcode)] \(.name) (\(.instances|length) instance(s))"' report_json.json || true
          if [ "$MED" -gt 0 ]; then
            echo "::warning::$MED Medium-risk ZAP alert(s) — not blocking (§3.3 gates on High), but worth triaging."
          fi
          if [ "$HIGH" -gt 0 ]; then
            echo "::error::$HIGH High-risk ZAP alert(s) — do not promote until triaged."
            exit 1
          fi
          echo "OK — no High-risk alerts."

  schemathesis-fuzz:
    name: Schemathesis API fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Install Schemathesis
        # jsonschema-rs is a transitive dep and was previously unpinned. 0.51.0
        # renamed CanonicalSchema.is_satisfiable() to .satisfiability, which
        # schemathesis 4.24.3 still called -- every fuzz run died with
        # `AttributeError: 'builtins.CanonicalSchema' object has no attribute
        # 'is_satisfiable'` and took the promotion gate down with it. 4.25.2
        # drops that call; jsonschema-rs is pinned too so the next breaking
        # release of a dep we don't name can't silently repeat this.
        run: pip install schemathesis==4.25.2 jsonschema-rs==0.51.0

# Checks are chosen deliberately, NOT `all`. The first real run showed `all`
      # blocks on two non-security classes:
      #   - status_code_conformance: endpoints return 401 (require_auth is a
      #     FastAPI dependency) but the generated schema doesn't declare a 401
      #     response -- OpenAPI drift, not a vulnerability.
      #   - unsupported_method: TRACE returns 405 without an `Allow` header
      #     (RFC 9110). That's the uvicorn/ALB default, not app code.
      # Gating promotion on those means the gate fails for reasons nobody will
      # act on, and a gate that always fails gets ignored. These are the
      # security-relevant properties:
      #   not_a_server_error      -- fuzzed input must never 5xx
      #   response_schema_conformance -- responses must match the contract
      #   negative_data_rejection -- invalid input must be rejected, not accepted
      #   ignored_auth            -- auth must actually be enforced (auth bypass)
      #   use_after_free / ensure_resource_availability -- resource-lifecycle bugs
      # The excluded conformance checks still run in the report artifact below
      # for visibility; they just don't block promotion.
      - name: Fuzz — unauthenticated
        run: |
          schemathesis run "${{ env.TARGET }}/openapi.json" \
            --url "${{ env.TARGET }}" \
            --checks not_a_server_error,response_schema_conformance,negative_data_rejection,ignored_auth,use_after_free,ensure_resource_availability \
            --max-examples 20 \
            --report-junit-path unauth-report.xml

      # The `secrets` context is NOT available in an `if:` condition (only in
      # `with:`, `env:`, and a few other places) -- referencing it there is a
      # workflow-validation error that fails the ENTIRE file to parse, so no
      # jobs run at all. Map it to env first, then branch on the env var.
      - name: Fuzz — authenticated
        env:
          DAST_API_TOKEN: ${{ secrets.DAST_API_TOKEN }}
        run: |
          if [ -z "$DAST_API_TOKEN" ]; then
            echo "DAST_API_TOKEN not set — skipping the authenticated pass."
            echo "Set it as a repo secret to fuzz behind auth (see docs/devsecops.md §3.3)."
            exit 0
          fi
          schemathesis run "${{ env.TARGET }}/openapi.json" \
            --url "${{ env.TARGET }}" \
            --header "Authorization:Bearer $DAST_API_TOKEN" \
            --checks not_a_server_error,response_schema_conformance,negative_data_rejection,ignored_auth,use_after_free,ensure_resource_availability \
            --max-examples 20 \
            --report-junit-path auth-report.xml

      - name: Upload fuzz reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 -- v4 is still node20 (deprecated); v7 is node24
        with:
          name: schemathesis-reports
          path: "*-report.xml"
          retention-days: 14

  # M9-T5 — testssl.sh against the ALB's TLS endpoint and the mail server's
  # IMAPS/submission listeners. Everything below the ALB's own TLS policy
  # (ELBSecurityPolicy-TLS13-1-2-2021-06, set in modules/alb) is config the
  # ALB owns; the mail server's cert/protocol config is cloud-init's own, so
  # both are worth scanning independently.
  tls-scan:
    name: testssl.sh — ALB + mail server
    runs-on: ubuntu-latest
    steps:
      # --jsonfile-pretty writes to a bind-mounted FILE, not /dev/stdout.
      # testssl.sh writes its human-readable progress to stdout as well, so
      # redirecting stdout to a .json produced a file with the scan transcript
      # spliced into the middle of the JSON -- jq died with "Invalid numeric
      # literal at line 9, column 2" and the gate below never evaluated a
      # single finding.
      #
      # The mount target is a dedicated 0777 directory, NOT $PWD. The
      # drwetter/testssl.sh image runs as a non-root user whose UID does not
      # match the runner's, so writing into a $PWD bind mount fails with
      # "Permission denied" on a Linux runner -- while succeeding on macOS
      # Docker Desktop, whose VirtioFS/osxfs layer papers over UID mismatches.
      # That difference is exactly why the first attempt at this fix passed
      # local verification and still produced three empty files in CI.
      - name: Prepare a container-writable output directory
        run: mkdir -p tls-out && chmod 0777 tls-out

      - name: Scan public ALB (esp-api.naratech.xyz:443)
        run: |
          docker run --rm -v "$PWD/tls-out:/out" drwetter/testssl.sh \
            --jsonfile-pretty /out/alb-tls.json --quiet esp-api.naratech.xyz:443 || true

      # STARTTLS on submission -- testssl.sh needs --starttls to negotiate it
      # instead of expecting TLS from the first byte, or every check no-ops.
      - name: Scan mail server submission (mail.naratech.xyz:587, STARTTLS)
        run: |
          docker run --rm -v "$PWD/tls-out:/out" drwetter/testssl.sh \
            --jsonfile-pretty /out/mail-submission-tls.json --quiet \
            --starttls smtp mail.naratech.xyz:587 || true

      - name: Scan mail server IMAPS (mail.naratech.xyz:993)
        run: |
          docker run --rm -v "$PWD/tls-out:/out" drwetter/testssl.sh \
            --jsonfile-pretty /out/mail-imaps-tls.json --quiet \
            mail.naratech.xyz:993 || true

      # testssl.sh severities: OK/INFO/LOW/MEDIUM/HIGH/CRITICAL. Gate on
      # HIGH/CRITICAL only, matching the ZAP gate's High-only threshold
      # above -- the self-signed mail cert (§5 of the mail filter testing
      # guide) already produces expected MEDIUM-ish noise on trust chain
      # checks that nobody will action until M7-T17's Let's Encrypt path is
      # confirmed live everywhere, so gating on MEDIUM would make this
      # ignorable on day one.
      - name: Gate on HIGH/CRITICAL findings
        run: |
          # Findings are nested: scanResult[] is one object per scanned IP,
          # whose values are arrays of findings grouped by category
          # (vulnerabilities, ciphers, protocols, ...). The previous `.[]`
          # iterated the TOP-LEVEL keys (Invocation, version, ...) instead,
          # so even valid JSON would never have matched a finding. Verified
          # against a real scan: this selector returns 326 findings whose
          # severity counts match a raw grep of the same file exactly.
          SELECT='.scanResult[] | to_entries[] | .value | arrays[] | select(.severity)'

          FAIL=0
          for f in tls-out/alb-tls.json tls-out/mail-submission-tls.json tls-out/mail-imaps-tls.json; do
            # A missing or empty report is a FAILURE, not a skip. This branch
            # used to `continue` with only a ::warning::, so when all three
            # scans failed to write their output the job still printed
            # "OK — no HIGH/CRITICAL TLS findings" and went green having
            # checked precisely nothing. That is strictly worse than the jq
            # crash it replaced: a crash is visibly broken, whereas a green
            # gate that inspected zero findings is indistinguishable from a
            # real pass. Caught only by reading the run log line by line
            # rather than trusting the check mark.
            if [ ! -s "$f" ]; then
              echo "::error::$f is missing or empty — the scan produced no report, so this gate proved nothing. Treating as a failure rather than a pass."
              FAIL=1
              continue
            fi
            # Explicit validity check: an unparseable file used to crash jq
            # mid-loop and fail the job with a parse error that read like a
            # TLS problem. A scan we cannot read is a broken gate, not a
            # clean result, so say so plainly and fail on it.
            if ! jq -e . "$f" >/dev/null 2>&1; then
              echo "::error::$f is not valid JSON — the scan or its output path is broken, so this gate proved nothing."
              FAIL=1
              continue
            fi
            COUNT=$(jq "[$SELECT | select(.severity == \"HIGH\" or .severity == \"CRITICAL\")] | length" "$f")
            echo "$f — HIGH/CRITICAL findings: $COUNT"
            jq -r "$SELECT | select(.severity == \"HIGH\" or .severity == \"CRITICAL\") | \"  [\(.severity)] \(.id): \(.finding)\"" "$f" || true
            if [ "$COUNT" -gt 0 ]; then FAIL=1; fi
          done
          if [ "$FAIL" -eq 1 ]; then
            echo "::error::HIGH/CRITICAL TLS finding(s) — do not promote until triaged."
            exit 1
          fi
          echo "OK — no HIGH/CRITICAL TLS findings."

      - name: Upload testssl.sh reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: testssl-reports
          path: "tls-out/*-tls.json"
          retention-days: 14

  # M9-T5 / SEC-01,02 (docs/m7-t4-t6-mail-filter-testing.md) — automates the
  # manual swaks test matrix that guide documents, against the live public
  # mail server (no SSM needed, port 25/587 are internet-facing by design).
  # Everything here is either rejected-by-design (relay/spoof attempts) or
  # entirely internal (testuser1<->testuser2) -- nothing sends real mail to
  # an external inbox.
  mail-relay-test:
    name: swaks — relay + spoof rejection tests
    runs-on: ubuntu-latest
    steps:
      - name: Install swaks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq swaks

      # S-07/M9-T2 — port 25 is receive-only. Relaying to an external domain
      # must be rejected with 554 5.7.1 before any bytes leave the server;
      # this is the "no open relay" acceptance criterion, automated.
      - name: "Test 1 — unauthenticated relay to external domain on :25 must be REJECTED"
        run: |
          set +e
          OUT=$(swaks --to nobody@example.com --from testuser1@mail.naratech.xyz \
            --server mail.naratech.xyz --port 25 \
            --header "Subject: relay test" --body "should be rejected" 2>&1)
          echo "$OUT"
          if echo "$OUT" | grep -q "554 5.7.1"; then
            echo "OK — relay correctly denied."
          else
            echo "::error::Expected '554 5.7.1 ... Relay access denied', got something else — possible open relay."
            exit 1
          fi

      # M9-T2 — submission (587) without SASL auth must also be rejected;
      # only authenticated senders may relay.
      - name: "Test 2 — unauthenticated submission on :587 must be REJECTED"
        run: |
          set +e
          OUT=$(swaks --to nobody@example.com --from testuser1@mail.naratech.xyz \
            --server mail.naratech.xyz --port 587 \
            --header "Subject: unauth submission test" --body "should be rejected" 2>&1)
          echo "$OUT"
          if echo "$OUT" | grep -qE "5\.7\.[01]|Authentication required"; then
            echo "OK — unauthenticated submission correctly denied."
          else
            echo "::error::Expected an auth-required rejection on :587, got something else."
            exit 1
          fi

      # Authenticated relay must actually work -- the negative tests above
      # are only meaningful if the positive path isn't also broken.
      - name: "Test 3 — authenticated submission on :587 must SUCCEED"
        run: |
          set +e
          OUT=$(swaks --to testuser2@mail.naratech.xyz --from testuser1@mail.naratech.xyz \
            --server mail.naratech.xyz --port 587 --tls \
            --auth-user testuser1 --auth-password 'ChangeMe123!' \
            --header "Subject: DAST authenticated relay test $(date -u +%s)" \
            --body "swaks authenticated submission check" 2>&1)
          echo "$OUT"
          if echo "$OUT" | grep -q "250"; then
            echo "OK — authenticated submission accepted."
          else
            echo "::error::Authenticated submission on :587 failed — check SASL/Dovecot auth socket."
            exit 1
          fi

      # The annotation check MUST use port 25, not submission. Submission
      # deliberately disables the milters (`-o smtpd_milters=` in master.cf)
      # and swaps in its own recipient restrictions, because SPF/DKIM/DMARC
      # validate INBOUND mail from strangers -- running them against our own
      # already-authenticated users' outbound mail would prove nothing.
      #
      # The first version of this test checked the message Test 3 sent over
      # 587 and therefore asserted a header that is correctly never present
      # there. It failed on its first ever nightly execution (2026-08-06);
      # the four green nights before that predate the test existing at all,
      # so this assertion has never actually passed.
      #
      # Local recipient on :25 is accepted rather than relayed:
      # reject_unauth_destination only refuses NON-local destinations, and
      # testuser2@mail.naratech.xyz is in mydestination.
      - name: "Test 4a — deliver an inbound message over :25 (the path milters run on)"
        run: |
          set +e
          TOKEN="dast-inbound-$(date -u +%s)"
          echo "MAIL_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          OUT=$(swaks --to testuser2@mail.naratech.xyz --from testuser1@mail.naratech.xyz \
            --server mail.naratech.xyz --port 25 \
            --header "Subject: $TOKEN" --body "inbound annotation check" 2>&1)
          echo "$OUT"
          if echo "$OUT" | grep -q "250 2.0.0 Ok"; then
            echo "OK — inbound message accepted for local delivery as $TOKEN."
          else
            echo "::error::Inbound delivery on :25 to a local mailbox failed — cannot verify annotation headers."
            exit 1
          fi

      # M9-T0 verification — confirm the message just delivered actually
      # carries Received-SPF / Authentication-Results, i.e. the
      # opendkim/opendmarc/policyd-spf pipeline is live end-to-end, not just
      # present in Terraform. Python's imaplib over 993 rather than another
      # CLI dependency.
      - name: "Test 4b — that message carries SPF/DKIM/DMARC annotation headers"
        run: |
          python3 - <<'PYEOF'
          import imaplib, os, ssl, sys, time

          token = os.environ["MAIL_TOKEN"]

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          m = imaplib.IMAP4_SSL("mail.naratech.xyz", 993, ssl_context=ctx)
          m.login("testuser2", "ChangeMe123!")
          m.select("INBOX")

          # Match on our own token instead of "newest message in the box":
          # the mailbox is shared with every other test and prior run, so
          # indexing the last message races with anything else delivering.
          ids = []
          for _ in range(10):
              typ, data = m.search(None, 'SUBJECT', token)
              ids = data[0].split()
              if ids:
                  break
              time.sleep(3)  # content_filter + LMTP delivery is not instant

          if not ids:
              print(f"::error::Message '{token}' never arrived in testuser2's INBOX after 30s.")
              m.logout()
              sys.exit(1)

          typ, msg = m.fetch(ids[-1], "(BODY[HEADER])")
          headers = msg[0][1].decode("utf-8", errors="replace")
          print(headers)
          has_spf = "Received-SPF" in headers or "Authentication-Results" in headers
          has_verdict = "X-Phishing-Verdict" in headers
          m.logout()

          if not has_spf:
              print("::error::No Received-SPF/Authentication-Results header — M9-T0's inbound SPF/DKIM/DMARC pipeline isn't annotating mail.")
              sys.exit(1)
          if not has_verdict:
              print("::error::No X-Phishing-Verdict header — the phishing content_filter isn't running.")
              sys.exit(1)
          print("OK — inbound mail carries both SPF/DKIM/DMARC and phishing-verdict annotations.")
          PYEOF

  # Both scans feed into this: a naratech-targeting PR (see the
  # naratech-promotion-gate job in terraform-pr.yml or wherever the gate
  # lives) checks the CONCLUSION of the most recent run of this workflow,
  # not just whether it exists -- this job's own success/failure is that
  # signal.
  gate:
    name: DAST nightly gate
    runs-on: ubuntu-latest
    needs: [zap-active, schemathesis-fuzz, tls-scan, mail-relay-test]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.zap-active.result }}" == "failure" ] \
             || [ "${{ needs.schemathesis-fuzz.result }}" == "failure" ] \
             || [ "${{ needs.tls-scan.result }}" == "failure" ] \
             || [ "${{ needs.mail-relay-test.result }}" == "failure" ]; then
            echo "HIGH finding(s) in tonight's DAST run -- do not promote to naratech until triaged." >&2
            exit 1
          fi
          echo "OK — no blocking findings in tonight's active scan + fuzz + TLS + mail relay tests."
