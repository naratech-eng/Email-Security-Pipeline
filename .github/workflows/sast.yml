name: SAST + Dependency Scan

# docs/devsecops.md §3.2 — shift-left static analysis + dependency scanning on
# every PR. Path-filtered like terraform-pr.yml's `changes` job: only run (and
# only require) the scan that actually applies to what changed.
on:
  pull_request:
    branches: [dev, naratech]

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'notebooks/M4/m4_t3_url_features.py'
            frontend:
              - 'frontend/**'
            workflows:
              - '.github/workflows/**'

  # A workflow with an invalid expression context (e.g. `secrets` in an `if:`)
  # is not a YAML error -- it parses fine and then fails at RUN time with zero
  # jobs and no usable log, which is exactly how dast-nightly.yml first broke.
  # actionlint validates contexts, action refs, and shell snippets statically,
  # so that class of bug fails a PR instead of a scheduled run at 3am.
  actionlint:
    name: actionlint (workflow validation)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned, not :latest -- a lint gate that silently changes behaviour
      # under you is worse than no gate. Downloaded rather than run via the
      # Docker action so the version is explicit and the run is fast.
      # SonarCloud S8482 (blocker): the old `curl | bash` installer script
      # executes whatever the download-actionlint.bash script says with no
      # verification of its own -- a compromised script (or a MITM without
      # even needing to compromise anything, since the pipe never checks a
      # signature) runs immediately. Downloading the release tarball
      # directly and checking it against a pinned sha256 means a tampered
      # artifact fails the checksum instead of silently executing.
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8" # linux_amd64, from the release's own checksums.txt
        run: |
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  python-sast:
    name: bandit + pip-audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install scanners
        run: python -m pip install --upgrade pip bandit==1.9.4 pip-audit==2.10.1

      # --severity-level and --confidence-level are mutually exclusive with
      # the older -l/-i shorthand (bandit errors if both are passed), hence
      # the explicit long forms. high/high matches the doc's "High severity
      # finding blocks merge" gate, not "any finding at all" -- verified
      # locally clean against the current backend/ at this threshold.
      - name: Bandit (Python SAST)
        run: bandit -r . --severity-level high --confidence-level high
        working-directory: backend

      # pip-audit has no severity filter of its own (CVEs it reports don't
      # uniformly carry one) -- treated as block-on-any-known-vulnerability,
      # which is the stricter reading of the dep-scan gate for a small,
      # explicit requirements.txt like this one.
      - name: pip-audit (dependency scan)
        run: pip-audit -r requirements.txt --desc
        working-directory: backend

  frontend-audit:
    name: npm audit + eslint + vitest
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7 -- v4 is still node20 (deprecated); v7 is node24
        with:
          node-version: "22" # react-router@8 declares engines.node >=22.22.0
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # --ignore-scripts (SonarCloud S6505): postinstall scripts run
      # arbitrary code from every package in the tree, not just the ones
      # this project chose to run. Verified none of the current deps need a
      # postinstall step -- build and the full test suite both pass
      # identically with it on.
      - name: npm ci
        run: npm ci --ignore-scripts
        working-directory: frontend

      # --audit-level=high mirrors "High CVE in deps blocks merge" (§3.2) --
      # low/moderate findings are visible in the log but don't fail the check.
      - name: npm audit (dependency scan)
        run: npm audit --audit-level=high
        working-directory: frontend

      # SEC-SAST — eslint-plugin-security + a hard block on
      # dangerouslySetInnerHTML. The dashboard renders attacker-controlled
      # content (an email's subject/sender come from whoever sent the mail),
      # so DOM-XSS sinks are the class of bug most worth failing a PR over.
      # Config and the reasoning behind each severity choice live in
      # frontend/eslint.config.js. Errors block; warnings (react-hooks debt,
      # detect-object-injection noise) stay visible without blocking.
      - name: eslint (incl. eslint-plugin-security)
        run: npm run lint
        working-directory: frontend

      # CI-T3 — vitest already ran inside sonarcloud.yml, but that step is
      # continue-on-error (Sonar's job is to upload coverage, not gate merge
      # -- backend-tests.yml/this job own gating). That meant a failing
      # frontend test never actually blocked a PR anywhere. This does.
      - name: vitest
        run: npm run test
        working-directory: frontend

  # SEC-SAST — Semgrep. Complements Bandit: Bandit is Python-only and
  # pattern-based, Semgrep adds the OWASP Top Ten rulesets and covers the
  # React/TS frontend too. --severity ERROR only, matching the §3.2 gate
  # ("HIGH/CRITICAL blocks the PR"); WARNING/INFO findings are printed but
  # don't fail. Verified clean against the current tree at this threshold
  # before being made blocking.
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install Semgrep
        run: python -m pip install --upgrade pip semgrep==1.172.0

      # --metrics off: don't phone home from CI. Registry rulesets (p/...) are
      # still fetched, which needs network but no account or token.
      - name: Semgrep — Python (backend)
        if: needs.changes.outputs.backend == 'true'
        run: |
          semgrep scan --config p/python --config p/owasp-top-ten \
            --severity ERROR --metrics off --error \
            backend/ notebooks/M4/m4_t3_url_features.py

      - name: Semgrep — JavaScript/React (frontend)
        if: needs.changes.outputs.frontend == 'true'
        run: |
          semgrep scan --config p/javascript --config p/react \
            --severity ERROR --metrics off --error \
            frontend/src

  # SEC-SAST — gitleaks over the FULL git history. This is the gap GitHub's
  # native push protection cannot cover: it only inspects new pushes, so
  # anything committed before it was enabled stays invisible to it. Needs
  # fetch-depth: 0 -- the default shallow clone would scan one commit and
  # report a clean history that was never actually checked.
  #
  # Run as the binary rather than gitleaks-action, which requires a paid
  # GITLEAKS_LICENSE for organisation-owned repos.
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --redact so a real finding doesn't get re-leaked into the CI log,
      # which is world-readable on a public repo.
      - name: gitleaks (git history secret scan)
        run: gitleaks git --no-banner --redact -v -c .gitleaks.toml .

  # SEC-SAST — CodeQL. Deeper than Bandit/Semgrep's pattern matching: it does
  # taint tracking across functions, catching flows those miss. Free here
  # because the repo is public. Results upload to the GitHub Security tab as
  # SARIF, which is why security-events: write is needed.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      # No autobuild step: both languages here are interpreted, so CodeQL
      # extracts straight from source. autobuild on a repo with a Dockerfile
      # can wander off trying to build the container instead.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: "/language:${{ matrix.language }}"

  # `changes` + these two conditional jobs means a PR touching only
  # infra/ or docs/ reports no SAST status at all -- required-checks lists
  # would then hang the way terraform-pr.yml's did before its own `changes`
  # job existed (see main.tf history). This job always runs and always
  # succeeds fast, so it's what branch protection should require, not the
  # two conditional jobs above.
  sast-gate:
    name: SAST + dependency scan
    runs-on: ubuntu-latest
    needs: [changes, python-sast, frontend-audit, actionlint, semgrep, gitleaks, codeql]
    if: always()
    steps:
      # CodeQL is reported but deliberately NOT blocking: security-extended is
      # a broad query set and this is its first run against the codebase, so
      # gating on it before anyone has triaged a baseline would block every PR
      # on findings nobody has looked at yet. Its results land in the Security
      # tab regardless. Promote it to blocking once a baseline is triaged.
      - name: Check results
        run: |
          FAILED=""
          [ "${{ needs.python-sast.result }}"    == "failure" ] && FAILED="$FAILED bandit/pip-audit"
          [ "${{ needs.frontend-audit.result }}" == "failure" ] && FAILED="$FAILED npm-audit/eslint/vitest"
          [ "${{ needs.actionlint.result }}"     == "failure" ] && FAILED="$FAILED actionlint"
          [ "${{ needs.semgrep.result }}"        == "failure" ] && FAILED="$FAILED semgrep"
          [ "${{ needs.gitleaks.result }}"       == "failure" ] && FAILED="$FAILED gitleaks"

          if [ "${{ needs.codeql.result }}" == "failure" ]; then
            echo "::warning::CodeQL reported findings — see the Security tab. Not blocking yet (see comment in sast.yml)."
          fi

          if [ -n "$FAILED" ]; then
            echo "::error::Blocking SAST/dependency check(s) failed:$FAILED"
            exit 1
          fi
          echo "OK — no blocking findings (backend changed: ${{ needs.changes.outputs.backend }}, frontend changed: ${{ needs.changes.outputs.frontend }})."
