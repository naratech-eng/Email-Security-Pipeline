name: SAST + Dependency Scan

# docs/devsecops.md §3.2 — shift-left static analysis + dependency scanning on
# every PR. Path-filtered like terraform-pr.yml's `changes` job: only run (and
# only require) the scan that actually applies to what changed.
on:
  pull_request:
    branches: [dev, naratech]

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'notebooks/M4/m4_t3_url_features.py'
            frontend:
              - 'frontend/**'

  python-sast:
    name: bandit + pip-audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install scanners
        run: python -m pip install --upgrade pip bandit pip-audit

      # --severity-level and --confidence-level are mutually exclusive with
      # the older -l/-i shorthand (bandit errors if both are passed), hence
      # the explicit long forms. high/high matches the doc's "High severity
      # finding blocks merge" gate, not "any finding at all" -- verified
      # locally clean against the current backend/ at this threshold.
      - name: Bandit (Python SAST)
        run: bandit -r . --severity-level high --confidence-level high
        working-directory: backend

      # pip-audit has no severity filter of its own (CVEs it reports don't
      # uniformly carry one) -- treated as block-on-any-known-vulnerability,
      # which is the stricter reading of the dep-scan gate for a small,
      # explicit requirements.txt like this one.
      - name: pip-audit (dependency scan)
        run: pip-audit -r requirements.txt --desc
        working-directory: backend

  frontend-audit:
    name: npm audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # react-router@8 declares engines.node >=22.22.0
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci
        working-directory: frontend

      # --audit-level=high mirrors "High CVE in deps blocks merge" (§3.2) --
      # low/moderate findings are visible in the log but don't fail the check.
      - name: npm audit (dependency scan)
        run: npm audit --audit-level=high
        working-directory: frontend

  # `changes` + these two conditional jobs means a PR touching only
  # infra/ or docs/ reports no SAST status at all -- required-checks lists
  # would then hang the way terraform-pr.yml's did before its own `changes`
  # job existed (see main.tf history). This job always runs and always
  # succeeds fast, so it's what branch protection should require, not the
  # two conditional jobs above.
  sast-gate:
    name: SAST + dependency scan
    runs-on: ubuntu-latest
    needs: [changes, python-sast, frontend-audit]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.python-sast.result }}" == "failure" ] || [ "${{ needs.frontend-audit.result }}" == "failure" ]; then
            echo "A SAST or dependency scan failed." >&2
            exit 1
          fi
          echo "OK — no HIGH findings in scans that ran (backend changed: ${{ needs.changes.outputs.backend }}, frontend changed: ${{ needs.changes.outputs.frontend }})."
