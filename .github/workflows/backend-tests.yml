name: Backend Tests

on:
  pull_request:
    branches: [dev, naratech]
    paths:
      - "backend/**"
      - "notebooks/M4/m4_t3_url_features.py"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - "notebooks/M4/m4_t3_url_features.py"

jobs:
  test:
    name: unit + integration tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      # Integration tests exercise the real M6 models. They aren't in git
      # (models/ is gitignored — see docs/m7-t1-fastapi-service.md), so
      # inference.py downloads them from S3 on first use via boto3, the same
      # way the ECS task will in production.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
        working-directory: backend

      - name: Run unit + integration tests
        run: python -m pytest tests/ -v
        working-directory: backend
