name: Terraform PR Checks

# No `paths:` filter here on purpose — dev's branch protection requires the
# "fmt / validate / security scan" and "terraform plan (dev)" job names on
# every PR. A path-filtered trigger means the workflow never runs at all for
# non-infra PRs, so those required checks sit "waiting" forever and block
# merge. Instead the workflow always runs; the `changes` job below decides
# whether there's actually anything to check, and the two jobs skip their
# real work (but still report a fast success) when there isn't.
on:
  pull_request:
    branches: [dev, naratech]

env:
  TF_VERSION: "1.10.5" # >= 1.10 required for S3 backend use_lockfile
  TF_WORKING_DIR: infra/envs/dev

jobs:
  changes:
    name: detect infra changes
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'
              - '.github/workflows/terraform-*.yml'

  lint-validate:
    name: fmt / validate / security scan
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        if: needs.changes.outputs.infra == 'true'

      - name: Setup Terraform
        if: needs.changes.outputs.infra == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        if: needs.changes.outputs.infra == 'true'
        run: terraform fmt -check -recursive
        working-directory: infra

      - name: Terraform init (no backend)
        if: needs.changes.outputs.infra == 'true'
        run: terraform init -backend=false
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform validate
        if: needs.changes.outputs.infra == 'true'
        run: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: tfsec
        if: needs.changes.outputs.infra == 'true'
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra
          soft_fail: false
          additional_args: --minimum-severity HIGH

      - name: Checkov
        if: needs.changes.outputs.infra == 'true'
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          soft_fail: false
          # CKV_AWS_144 — cross-region replication not needed in dev
          # CKV_AWS_18  — S3 access logging delegated to dedicated logs bucket
          skip_check: CKV_AWS_144,CKV_AWS_18

      - name: No infra changes
        if: needs.changes.outputs.infra != 'true'
        run: echo "No infra/ changes in this PR — skipping Terraform checks."

  terraform-plan:
    name: terraform plan (dev)
    runs-on: ubuntu-latest
    needs: [changes, lint-validate]
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        if: needs.changes.outputs.infra == 'true'

      - name: Configure AWS credentials (OIDC)
        if: needs.changes.outputs.infra == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        if: needs.changes.outputs.infra == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        if: needs.changes.outputs.infra == 'true'
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform plan
        id: plan
        if: needs.changes.outputs.infra == 'true'
        run: |
          terraform plan \
            -var="key_name=${{ secrets.TF_VAR_KEY_NAME }}" \
            -var="db_password=${{ secrets.TF_VAR_DB_PASSWORD }}" \
            -out=tfplan \
            -no-color 2>&1 | tee plan.txt
        working-directory: ${{ env.TF_WORKING_DIR }}
        continue-on-error: true

      - name: Post plan as PR comment
        if: needs.changes.outputs.infra == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? '…truncated (showing last 60 kB)\n' + plan.slice(-60000) : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan — dev\n\`\`\`\n${truncated}\n\`\`\``
            });

      - name: Fail if plan errored
        if: needs.changes.outputs.infra == 'true' && steps.plan.outcome == 'failure'
        run: exit 1

      - name: No infra changes
        if: needs.changes.outputs.infra != 'true'
        run: echo "No infra/ changes in this PR — skipping Terraform plan."
