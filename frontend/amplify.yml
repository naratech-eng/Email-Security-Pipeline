# AWS Amplify Hosting build spec for the Email Security Pipeline dashboard.
# appRoot scopes this to the frontend/ subdirectory of the monorepo.
# Branch -> environment mapping and the SPA rewrite rule are configured ONCE in
# the Amplify console (see frontend/README.md) — this spec must not fight them.
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            # react-router@8 declares engines.node >=22.22.0; nvm avoids
            # depending on whatever the build image's default Node happens to
            # be (unconfirmed, and Amplify's default has historically lagged
            # new majors). Amplify's build image includes nvm for exactly
            # this reason.
            - nvm install 22 && nvm use 22
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - ~/.npm/**/*
