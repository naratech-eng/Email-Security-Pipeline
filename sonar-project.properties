# SEC-SONAR — SonarCloud (hosted SonarQube), the last outstanding item from
# docs/devsecops.md §3.2.
#
# SETUP REQUIRED BEFORE THIS DOES ANYTHING (one-time, needs a human):
#   1. Sign in at https://sonarcloud.io with the GitHub account that owns
#      naratech-eng, and import this repository.
#   2. In the project's Administration > Analysis Method, DISABLE "Automatic
#      Analysis". It conflicts with CI-based analysis -- with both on,
#      SonarCloud rejects the CI upload rather than merging the two.
#   3. Generate a token (My Account > Security) and add it to this repo as the
#      Actions secret SONAR_TOKEN.
# Until SONAR_TOKEN exists, .github/workflows/sonarcloud.yml skips cleanly
# instead of failing -- same pattern as DAST_API_TOKEN in dast-nightly.yml.
#
# If the values below don't match what SonarCloud generated on import, take
# SonarCloud's -- it derives them from the org/repo name and won't accept a
# mismatch.

sonar.projectKey=naratech-eng_Email-Security-Pipeline
sonar.organization=naratech-eng
sonar.projectName=Email Security Pipeline

# Analysed source. infra/ is included deliberately: Sonar has Terraform rules
# (secrets in plaintext, over-permissive IAM/SG) that overlap Checkov/tfsec but
# catch a slightly different set, and duplicate coverage on IaC is cheap.
sonar.sources=backend,frontend/src,infra
sonar.tests=backend/tests,frontend/src/lib
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,backend/tests/**

# Generated, vendored, or non-source content. Notebooks are excluded because
# they're exploratory M4-M6 artifacts, not maintained application code --
# analysing them would bury real findings under research-code noise.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/.terraform/**,\
  **/migrations/versions/**,\
  notebooks/**,\
  **/*.ipynb,\
  frontend/src/components/ui/**

# Coverage, produced by the workflow before the scan runs. Paths are relative
# to this file (repo root).
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.python.version=3.13
sonar.sourceEncoding=UTF-8
