<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 790" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/>
    </marker>
  </defs>
  <rect width="1600" height="790" fill="#FFFFFF"/>

  <text x="60" y="62" font-size="38" font-weight="bold" fill="#2E1065">Detecting a Leak Is Not Preventing One</text>
  <text x="60" y="100" font-size="23" fill="#6B7280">The same tool, gitleaks, run one stage apart &#8212; and the security outcome is completely different.</text>

  <!-- ================= LANE A : detection only ================= -->
  <rect x="60" y="145" width="1480" height="250" rx="14" fill="#FEF2F2" stroke="#DC2626" stroke-width="3"/>
  <text x="80" y="182" font-size="23" font-weight="bold" fill="#991B1B">CI ONLY &#8212; the scanner runs after the push</text>

  <g>
    <rect x="90" y="205" width="260" height="88" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2"/>
    <text x="220" y="238" font-size="18" font-weight="bold" fill="#2E1065" text-anchor="middle">Developer hardcodes</text>
    <text x="220" y="262" font-size="18" font-weight="bold" fill="#2E1065" text-anchor="middle">a DB password</text>

    <rect x="380" y="205" width="260" height="88" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2"/>
    <text x="510" y="245" font-size="19" font-weight="bold" fill="#2E1065" text-anchor="middle">git commit</text>
    <text x="510" y="270" font-size="16" fill="#6B7280" text-anchor="middle">nothing checks it</text>

    <rect x="670" y="205" width="260" height="88" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2"/>
    <text x="800" y="245" font-size="19" font-weight="bold" fill="#2E1065" text-anchor="middle">git push</text>
    <text x="800" y="270" font-size="16" fill="#6B7280" text-anchor="middle">to a public repo</text>

    <rect x="960" y="205" width="260" height="88" rx="10" fill="#DC2626" stroke="#991B1B" stroke-width="2"/>
    <text x="1090" y="240" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PUBLIC WORLDWIDE</text>
    <text x="1090" y="266" font-size="16" fill="#FEE2E2" text-anchor="middle">scrapers index in seconds</text>

    <rect x="1250" y="205" width="260" height="88" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2"/>
    <text x="1380" y="238" font-size="18" font-weight="bold" fill="#991B1B" text-anchor="middle">gitleaks reports it</text>
    <text x="1380" y="264" font-size="16" fill="#6B7280" text-anchor="middle">the PR turns red</text>
  </g>

  <line x1="352" y1="249" x2="376" y2="249" stroke="#9CA3AF" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="642" y1="249" x2="666" y2="249" stroke="#9CA3AF" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="932" y1="249" x2="956" y2="249" stroke="#9CA3AF" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="1222" y1="249" x2="1246" y2="249" stroke="#9CA3AF" stroke-width="2.5" marker-end="url(#ar)"/>

  <rect x="90" y="305" width="1420" height="72" rx="10" fill="#991B1B"/>
  <text x="800" y="336" font-size="21" font-weight="bold" fill="#FFFFFF" text-anchor="middle">The credential is already compromised. It must be rotated.</text>
  <text x="800" y="363" font-size="19" fill="#FECACA" text-anchor="middle">Rewriting history does not undo this &#8212; you cannot un-publish a secret. The scan told you, it did not save you.</text>

  <!-- ================= LANE B : prevention ================= -->
  <rect x="60" y="425" width="1480" height="250" rx="14" fill="#ECFDF5" stroke="#059669" stroke-width="3"/>
  <text x="80" y="462" font-size="23" font-weight="bold" fill="#065F46">PRE-COMMIT &#8212; the same scanner, one stage earlier</text>

  <g>
    <rect x="90" y="485" width="260" height="88" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="2"/>
    <text x="220" y="518" font-size="18" font-weight="bold" fill="#2E1065" text-anchor="middle">Developer hardcodes</text>
    <text x="220" y="542" font-size="18" font-weight="bold" fill="#2E1065" text-anchor="middle">a DB password</text>

    <rect x="380" y="485" width="260" height="88" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="2"/>
    <text x="510" y="518" font-size="18" font-weight="bold" fill="#065F46" text-anchor="middle">git commit runs</text>
    <text x="510" y="543" font-size="18" font-weight="bold" fill="#065F46" text-anchor="middle">gitleaks locally</text>

    <rect x="670" y="485" width="260" height="88" rx="10" fill="#059669" stroke="#065F46" stroke-width="2"/>
    <text x="800" y="522" font-size="21" font-weight="bold" fill="#FFFFFF" text-anchor="middle">COMMIT BLOCKED</text>
    <text x="800" y="548" font-size="16" fill="#D1FAE5" text-anchor="middle">exit 1 &#183; HEAD unchanged</text>

    <rect x="960" y="485" width="550" height="88" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <text x="1235" y="522" font-size="20" font-weight="bold" fill="#065F46" text-anchor="middle">The secret never entered git history.</text>
    <text x="1235" y="548" font-size="18" fill="#047857" text-anchor="middle">Nothing to rotate. Nothing to disclose. No incident.</text>
  </g>

  <line x1="352" y1="529" x2="376" y2="529" stroke="#9CA3AF" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="642" y1="529" x2="666" y2="529" stroke="#9CA3AF" stroke-width="2.5" marker-end="url(#ar)"/>

  <rect x="90" y="585" width="1420" height="72" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  <text x="800" y="616" font-size="20" font-weight="bold" fill="#065F46" text-anchor="middle">Verified, not assumed: a probe commit containing a fake AWS key was blocked &#8212; 2 leaks found, HEAD unchanged.</text>
  <text x="800" y="643" font-size="18" fill="#52525B" text-anchor="middle">Honest caveat: hooks are opt-in per clone and bypassable with --no-verify, so the CI gitleaks job stays as the backstop. Defence in depth, not a swap.</text>

  <text x="60" y="722" font-size="19" fill="#6B7280">GitHub push protection helps, but only for provider-recognised token formats &#8212; it would not have caught a plain hardcoded database password.</text>
  <text x="60" y="752" font-size="19" fill="#6B7280">This is the single highest-value shift-left move in the project: it is the only control that changes the outcome rather than the reporting.</text>
</svg>
