<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A855F7"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="60" y="70" font-size="40" font-weight="bold" fill="#2E1065">DevSecOps Pipeline — Shift-Left Security</text>
  <text x="60" y="112" font-size="26" fill="#6B7280">Every PR is scanned before a human reviews it · GitHub Actions</text>

  <!-- PR stage -->
  <rect x="60" y="200" width="200" height="120" rx="14" fill="#F3E8FF" stroke="#7C3AED" stroke-width="3"/>
  <text x="160" y="252" font-size="28" font-weight="bold" fill="#2E1065" text-anchor="middle">Pull</text>
  <text x="160" y="288" font-size="28" font-weight="bold" fill="#2E1065" text-anchor="middle">Request</text>

  <!-- Lint + tests -->
  <rect x="320" y="200" width="220" height="120" rx="14" fill="#FAF5FF" stroke="#A78BFA" stroke-width="3"/>
  <text x="430" y="252" font-size="26" font-weight="bold" fill="#2E1065" text-anchor="middle">Lint + Format</text>
  <text x="430" y="288" font-size="26" fill="#52525B" text-anchor="middle">Unit Tests</text>

  <!-- Security scans big box -->
  <rect x="600" y="160" width="440" height="480" rx="18" fill="#FDF2F8" stroke="#DB2777" stroke-width="3.5"/>
  <text x="820" y="212" font-size="28" font-weight="bold" fill="#DB2777" text-anchor="middle">SECURITY SCANS</text>

  <g fill="#2E1065">
    <rect x="630" y="240" width="380" height="66" rx="10" fill="#FFFFFF" stroke="#DB2777" stroke-width="2"/>
    <text x="820" y="268" font-size="23" text-anchor="middle" font-weight="bold">SAST — our code</text>
    <text x="820" y="296" font-size="21" text-anchor="middle" fill="#52525B">Bandit · Semgrep · CodeQL · eslint-sec</text>

    <rect x="630" y="318" width="380" height="66" rx="10" fill="#FFFFFF" stroke="#DB2777" stroke-width="2"/>
    <text x="820" y="346" font-size="23" text-anchor="middle" font-weight="bold">Quality gate</text>
    <text x="820" y="374" font-size="21" text-anchor="middle" fill="#52525B">SonarCloud (SonarQube)</text>

    <rect x="630" y="396" width="380" height="66" rx="10" fill="#FFFFFF" stroke="#DB2777" stroke-width="2"/>
    <text x="820" y="424" font-size="23" text-anchor="middle" font-weight="bold">IaC + container</text>
    <text x="820" y="452" font-size="21" text-anchor="middle" fill="#52525B">tfsec · Checkov · Trivy</text>

    <rect x="630" y="474" width="380" height="66" rx="10" fill="#FFFFFF" stroke="#DB2777" stroke-width="2"/>
    <text x="820" y="502" font-size="23" text-anchor="middle" font-weight="bold">Deps + secrets</text>
    <text x="820" y="530" font-size="21" text-anchor="middle" fill="#52525B">pip-audit · npm audit · gitleaks</text>
  </g>
  <rect x="630" y="560" width="380" height="56" rx="28" fill="#BE185D"/>
  <text x="820" y="597" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">HIGH / CRITICAL blocks merge</text>

  <!-- Review / merge -->
  <rect x="1100" y="200" width="200" height="120" rx="14" fill="#FAF5FF" stroke="#A78BFA" stroke-width="3"/>
  <text x="1200" y="252" font-size="26" font-weight="bold" fill="#2E1065" text-anchor="middle">Review</text>
  <text x="1200" y="288" font-size="24" fill="#52525B" text-anchor="middle">+ terraform plan</text>

  <rect x="1360" y="200" width="180" height="120" rx="14" fill="#F3E8FF" stroke="#7C3AED" stroke-width="3"/>
  <text x="1450" y="252" font-size="26" font-weight="bold" fill="#2E1065" text-anchor="middle">Merge</text>
  <text x="1450" y="288" font-size="24" fill="#52525B" text-anchor="middle">to dev</text>

  <!-- Deploy row -->
  <rect x="1100" y="420" width="440" height="150" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="3"/>
  <text x="1320" y="470" font-size="26" font-weight="bold" fill="#2E1065" text-anchor="middle">Deploy</text>
  <text x="1320" y="506" font-size="23" fill="#52525B" text-anchor="middle">terraform apply · ECS rolling deploy</text>
  <text x="1320" y="538" font-size="23" fill="#52525B" text-anchor="middle">Amplify deploy → health + smoke tests</text>

  <!-- flow arrows top -->
  <line x1="260" y1="260" x2="312" y2="260" stroke="#6B7280" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="540" y1="260" x2="592" y2="260" stroke="#6B7280" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1040" y1="260" x2="1092" y2="260" stroke="#6B7280" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1300" y1="260" x2="1352" y2="260" stroke="#6B7280" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1450" y1="320" x2="1380" y2="412" stroke="#6B7280" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- DAST lane -->
  <rect x="60" y="690" width="1480" height="170" rx="18" fill="#FAF5FF" stroke="#A855F7" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="90" y="738" font-size="26" font-weight="bold" fill="#A855F7">DAST — against the running system (post-deploy + nightly)</text>
  <text x="90" y="786" font-size="23" fill="#2E1065">OWASP ZAP — passive baseline per preview · nightly full active scan</text>
  <text x="90" y="822" font-size="23" fill="#2E1065">Schemathesis — OpenAPI fuzzing of every endpoint · authenticated dashboard scan</text>
  <rect x="1170" y="762" width="350" height="56" rx="28" fill="#BE185D"/>
  <text x="1345" y="799" font-size="23" font-weight="bold" fill="#FFFFFF" text-anchor="middle">HIGH blocks promotion to prod</text>
  <path d="M 1320 570 L 1320 682" fill="none" stroke="#A855F7" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#arrowP)"/>
</svg>
