<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#BE185D"/>
    </marker>
    <marker id="arrowY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97706"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrowV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="60" y="70" font-size="40" font-weight="bold" fill="#2E1065">Workflow — Phase B: Live Mail Flow</text>
  <text x="60" y="112" font-size="26" fill="#6B7280">Every inbound email is scored before delivery</text>
  <rect x="1330" y="45" width="210" height="60" rx="30" fill="#F3E8FF" stroke="#7C3AED" stroke-width="3"/>
  <text x="1435" y="85" font-size="28" font-weight="bold" fill="#6D28D9" text-anchor="middle">&lt; 2 s / email</text>

  <!-- fail-open callout -->
  <rect x="60" y="150" width="680" height="66" rx="14" fill="#FDF2F8" stroke="#EC4899" stroke-width="2.5"/>
  <text x="400" y="192" font-size="24" fill="#2E1065" text-anchor="middle"><tspan font-weight="bold" fill="#BE185D">Fail-open:</tspan> API unreachable → mail delivers normally</text>

  <!-- Pipeline -->
  <g>
    <circle cx="140" cy="330" r="26" fill="#F3E8FF" stroke="#7C3AED" stroke-width="3"/>
    <rect x="95" y="362" width="90" height="46" rx="23" fill="#F3E8FF" stroke="#7C3AED" stroke-width="3"/>
    <text x="140" y="448" font-size="26" font-weight="bold" fill="#2E1065" text-anchor="middle">Sender</text>
  </g>

  <rect x="250" y="290" width="250" height="150" rx="14" fill="#FCE7F3" stroke="#DB2777" stroke-width="3"/>
  <text x="375" y="348" font-size="28" font-weight="bold" fill="#2E1065" text-anchor="middle">Postfix</text>
  <text x="375" y="386" font-size="23" fill="#52525B" text-anchor="middle">SMTP DATA</text>

  <rect x="565" y="290" width="250" height="150" rx="14" fill="#FCE7F3" stroke="#DB2777" stroke-width="3"/>
  <text x="690" y="348" font-size="28" font-weight="bold" fill="#2E1065" text-anchor="middle">content_filter</text>
  <text x="690" y="386" font-size="22" fill="#52525B" text-anchor="middle">mTLS / signed token</text>

  <rect x="880" y="290" width="250" height="150" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="4"/>
  <text x="1005" y="342" font-size="28" font-weight="bold" fill="#2E1065" text-anchor="middle">FastAPI · ECS</text>
  <text x="1005" y="380" font-size="23" fill="#52525B" text-anchor="middle">POST /score</text>
  <text x="1005" y="412" font-size="23" fill="#52525B" text-anchor="middle">via internal ALB</text>

  <line x1="185" y1="365" x2="242" y2="365" stroke="#6B7280" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="500" y1="365" x2="557" y2="365" stroke="#6B7280" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="815" y1="365" x2="872" y2="365" stroke="#6B7280" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- verdict diamond -->
  <polygon points="1290,290 1400,365 1290,440 1180,365" fill="#F3E8FF" stroke="#A855F7" stroke-width="3"/>
  <text x="1290" y="375" font-size="28" font-weight="bold" fill="#2E1065" text-anchor="middle">verdict?</text>
  <line x1="1130" y1="365" x2="1172" y2="365" stroke="#6B7280" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Outcomes -->
  <rect x="1130" y="530" width="330" height="90" rx="14" fill="#FDF2F8" stroke="#BE185D" stroke-width="3"/>
  <text x="1295" y="568" font-size="26" font-weight="bold" fill="#BE185D" text-anchor="middle">quarantine</text>
  <text x="1295" y="602" font-size="23" fill="#52525B" text-anchor="middle">Dovecot Quarantine folder</text>

  <rect x="1130" y="650" width="330" height="90" rx="14" fill="#FFFBEB" stroke="#D97706" stroke-width="3"/>
  <text x="1295" y="688" font-size="26" font-weight="bold" fill="#B45309" text-anchor="middle">flag</text>
  <text x="1295" y="722" font-size="23" fill="#52525B" text-anchor="middle">X-Phish-Score header → inbox</text>

  <rect x="1130" y="770" width="330" height="90" rx="14" fill="#ECFDF5" stroke="#059669" stroke-width="3"/>
  <text x="1295" y="808" font-size="26" font-weight="bold" fill="#059669" text-anchor="middle">clean</text>
  <text x="1295" y="842" font-size="23" fill="#52525B" text-anchor="middle">deliver normally to inbox</text>

  <path d="M 1290 445 L 1290 522" fill="none" stroke="#BE185D" stroke-width="3.5" marker-end="url(#arrowR)"/>
  <path d="M 1245 430 Q 1040 555 1122 693" fill="none" stroke="#D97706" stroke-width="3.5" marker-end="url(#arrowY)"/>
  <path d="M 1215 415 Q 980 600 1122 812" fill="none" stroke="#059669" stroke-width="3.5" marker-end="url(#arrowG)"/>

  <!-- detections + dashboard note -->
  <g>
    <path d="M 330 720 a 80 20 0 0 0 160 0 v -55 a 80 20 0 0 0 -160 0 z" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="3"/>
    <ellipse cx="410" cy="665" rx="80" ry="20" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="3"/>
    <text x="410" y="782" font-size="25" font-weight="bold" fill="#2E1065" text-anchor="middle">RDS · source = server</text>
  </g>
  <path d="M 970 445 Q 800 620 500 680" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrowV)"/>
  <text x="790" y="600" font-size="23" fill="#8B5CF6" text-anchor="middle">every detection recorded</text>
  <text x="410" y="822" font-size="23" fill="#52525B" text-anchor="middle">visible in dashboard next to</text>
  <text x="410" y="852" font-size="23" fill="#52525B" text-anchor="middle">upload-mode results</text>
</svg>
