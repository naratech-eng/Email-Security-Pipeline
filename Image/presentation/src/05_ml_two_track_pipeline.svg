<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
    <marker id="arrowV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="60" y="70" font-size="40" font-weight="bold" fill="#2E1065">ML Pipeline — Two Independent Tracks</text>
  <text x="60" y="112" font-size="26" fill="#6B7280">An email is a document; a URL is a short adversarial string — different features, different models</text>

  <!-- Email track lane -->
  <rect x="60" y="160" width="1240" height="290" rx="18" fill="#FAF5FF" stroke="#C4B5FD" stroke-width="2.5"/>
  <text x="90" y="205" font-size="28" font-weight="bold" fill="#7C3AED">EMAIL TRACK</text>

  <g>
    <path d="M 110 380 a 85 21 0 0 0 170 0 v -105 a 85 21 0 0 0 -170 0 z" fill="#F3E8FF" stroke="#7C3AED" stroke-width="3"/>
    <ellipse cx="195" cy="275" rx="85" ry="21" fill="#F3E8FF" stroke="#7C3AED" stroke-width="3"/>
    <text x="195" y="330" font-size="26" font-weight="bold" fill="#2E1065" text-anchor="middle">82,078</text>
    <text x="195" y="362" font-size="22" fill="#52525B" text-anchor="middle">emails</text>
    <text x="195" y="435" font-size="21" fill="#52525B" text-anchor="middle">65,662 train / 16,416 test</text>
  </g>

  <rect x="370" y="250" width="320" height="150" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/>
  <text x="530" y="300" font-size="26" font-weight="bold" fill="#2E1065" text-anchor="middle">Features</text>
  <text x="530" y="336" font-size="22" fill="#52525B" text-anchor="middle">TF-IDF · 20k · uni+bigrams</text>
  <text x="530" y="368" font-size="22" fill="#52525B" text-anchor="middle">+ urgency, word counts</text>

  <rect x="770" y="250" width="280" height="150" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="4"/>
  <text x="910" y="302" font-size="28" font-weight="bold" fill="#2E1065" text-anchor="middle">LinearSVC</text>
  <text x="910" y="342" font-size="25" fill="#6D28D9" text-anchor="middle" font-weight="bold">F1 = 0.9903</text>
  <text x="910" y="376" font-size="22" fill="#52525B" text-anchor="middle">42 s train · CPU</text>

  <rect x="1100" y="272" width="190" height="106" rx="20" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="3"/>
  <text x="1195" y="318" font-size="22" font-weight="bold" fill="#2E1065" text-anchor="middle">email_linearsvc</text>
  <text x="1195" y="350" font-size="22" fill="#52525B" text-anchor="middle">.joblib</text>

  <line x1="290" y1="325" x2="362" y2="325" stroke="#6B7280" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="690" y1="325" x2="762" y2="325" stroke="#6B7280" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1050" y1="325" x2="1092" y2="325" stroke="#6B7280" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- URL track lane -->
  <rect x="60" y="480" width="1240" height="290" rx="18" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="2.5"/>
  <text x="90" y="525" font-size="28" font-weight="bold" fill="#DB2777">URL TRACK</text>

  <g>
    <path d="M 110 700 a 85 21 0 0 0 170 0 v -105 a 85 21 0 0 0 -170 0 z" fill="#FCE7F3" stroke="#DB2777" stroke-width="3"/>
    <ellipse cx="195" cy="595" rx="85" ry="21" fill="#FCE7F3" stroke="#DB2777" stroke-width="3"/>
    <text x="195" y="650" font-size="26" font-weight="bold" fill="#2E1065" text-anchor="middle">641,119</text>
    <text x="195" y="682" font-size="22" fill="#52525B" text-anchor="middle">URLs</text>
    <text x="195" y="755" font-size="21" fill="#52525B" text-anchor="middle">512,895 train / 128,224 test</text>
  </g>

  <rect x="370" y="570" width="320" height="150" rx="14" fill="#FFFFFF" stroke="#DB2777" stroke-width="3"/>
  <text x="530" y="620" font-size="26" font-weight="bold" fill="#2E1065" text-anchor="middle">Features</text>
  <text x="530" y="656" font-size="22" fill="#52525B" text-anchor="middle">raw 200-char sequence (CNN)</text>
  <text x="530" y="688" font-size="22" fill="#52525B" text-anchor="middle">11 engineered feats (RF)</text>

  <rect x="770" y="570" width="280" height="150" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="4"/>
  <text x="910" y="620" font-size="28" font-weight="bold" fill="#2E1065" text-anchor="middle">Char-CNN</text>
  <text x="910" y="658" font-size="25" fill="#6D28D9" text-anchor="middle" font-weight="bold">F1 = 0.9739</text>
  <text x="910" y="692" font-size="21" fill="#52525B" text-anchor="middle">RF fallback · F1 0.866 · CPU</text>

  <rect x="1100" y="592" width="190" height="106" rx="20" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="3"/>
  <text x="1195" y="638" font-size="22" font-weight="bold" fill="#2E1065" text-anchor="middle">url_charcnn</text>
  <text x="1195" y="670" font-size="22" fill="#52525B" text-anchor="middle">.keras + vocab</text>

  <line x1="290" y1="645" x2="362" y2="645" stroke="#6B7280" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="690" y1="645" x2="762" y2="645" stroke="#6B7280" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1050" y1="645" x2="1092" y2="645" stroke="#6B7280" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- S3 registry -->
  <g>
    <path d="M 1370 540 a 90 22 0 0 0 180 0 v -90 a 90 22 0 0 0 -180 0 z" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="3.5"/>
    <ellipse cx="1460" cy="450" rx="90" ry="22" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="3.5"/>
    <text x="1460" y="508" font-size="26" font-weight="bold" fill="#2E1065" text-anchor="middle">S3</text>
    <text x="1460" y="610" font-size="25" font-weight="bold" fill="#2E1065" text-anchor="middle">Artifact Registry</text>
    <text x="1460" y="642" font-size="21" fill="#52525B" text-anchor="middle">registry.json + models</text>
    <text x="1460" y="674" font-size="21" fill="#52525B" text-anchor="middle">pulled by ECS at startup</text>
  </g>
  <path d="M 1292 325 Q 1420 340 1450 424" fill="none" stroke="#8B5CF6" stroke-width="3.5" marker-end="url(#arrowV)"/>
  <path d="M 1292 645 Q 1338 636 1376 528" fill="none" stroke="#8B5CF6" stroke-width="3.5" marker-end="url(#arrowV)"/>

  <!-- freeze note -->
  <rect x="60" y="800" width="1240" height="60" rx="14" fill="#FDF2F8" stroke="#EC4899" stroke-width="2.5"/>
  <text x="680" y="840" font-size="23" fill="#2E1065" text-anchor="middle">Stratified splits <tspan font-weight="bold">frozen + checksummed</tspan> before final training (M6 data freeze) — no train/test leakage</text>
</svg>
